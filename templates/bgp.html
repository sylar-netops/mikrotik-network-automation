{% extends 'base.html' %}

{% block body %}

    <div class="container">
        <h4 class="mt-3 mb-2">BGP</h4>
        <table id="example" class="cell-border display nowrap" style="width:100%">
            <thead>
            <tr>
                <th scope="col">HOST</th>
                <th scope="col">NAME</th>
                <th scope="col">LOCAL-ADDRESS</th>
                <th scope="col">LOCAL-AS</th>
                <th scope="col">REMOTE-ADDRESS</th>
                <th scope="col">REMOTE-AS</th>
                <th scope="col">ESTABLISHED</th>
            </tr>
            </thead>
        </table>
    </div>
    <script>
        var devlist = {{ devlist|safe }};
        $(document).ready(function () {
            $('#example').DataTable({
                "ajax": {
                    "url": "getBGP",
                    "type": "POST",
                    "headers": {
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    "data": function (d) {
                        d.devices_json = JSON.stringify(devlist);
                        return d;
                    },
                    "dataSrc": "data"
                },
                "columns": [
                    {data: 'host'},
                    {data: 'name'},
                    {data: 'local-address'},
                    {data: 'local-as'},
                    {data: 'remote-address'},
                    {data: 'remote-as'},
                    {
                        data: 'established',
                        render: function (data, type, row, meta) {
                            if (data == 'true') {
                                return `<nobr><span class="badge text-bg-success">${data}</span></nobr>`;
                            } else {
                                return `<nobr><span class="badge text-bg-danger">${data}</span></nobr>`;
                            }
                        }
                    },
                ],
                columnDefs: [{type: 'name', targets: 1}],
                order: [[1, 'asc']]
            });
        });
    </script>
{% endblock body %}
